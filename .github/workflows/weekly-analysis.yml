name: Weekly analysis smoke test (mock only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m seo_media.weekly --mock
      - uses: actions/upload-artifact@v4
        with:
          name: mock-weekly-analysis
          path: output/weekly.json
          retention-days: 14
